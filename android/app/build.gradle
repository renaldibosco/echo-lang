plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.renaldibosco.echolang'
    compileSdk 34

    defaultConfig {
        applicationId 'com.renaldibosco.echolang'
        minSdk 24
        targetSdk 34
        // every CI run gets a higher number automatically
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger())
        versionName '2.0.1'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // The signing key never lives in the repo. CI writes it from the ECHO_KEYSTORE_BASE64 secret.
    signingConfigs {
        release {
            storeFile file(System.getenv('ECHO_KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('ECHO_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ECHO_KEY_ALIAS') ?: 'echo'
            keyPassword System.getenv('ECHO_KEY_PASSWORD') ?: System.getenv('ECHO_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8: shrink and obfuscate the Java code
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.12'
    }
    sourceSets {
        main {
            srcDir '../../python'
        }
    }
}
